name: Docker

on:
  push:
    branches: [ "main-custom" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main-custom" ]

env:
  # Images are delivered only to the local cluster — Zot is the system of
  # record (no GHCR mirror by decision, 2026-09-08). amd64 only: every Mautic
  # pod runs on amd64 nodes; the arm64-under-QEMU build was dropped with the
  # move to in-cluster ARC runners.
  REGISTRY: zot.internal.flowbridge.net
  IMAGE_NAME: mautic
  MAUTIC_VERSION: "7.2.0"

jobs:
  build:
    runs-on: docker-mautic-amd64
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.prep.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail fast if the whole-file overlays were cut from a different Mautic
      # version than we are about to build (they would silently revert
      # upstream changes). scripts/sync-patches.sh regenerates them.
      # The Dockerfile re-checks this at the overlay layer.
      - name: Patch base-version guard
        run: |
          base="$(cut -d' ' -f1 patches/.base-version)"
          if [ "$base" != "$MAUTIC_VERSION" ]; then
            echo "::error::patches/ generated for Mautic $base but MAUTIC_VERSION=$MAUTIC_VERSION — rebase the patch branch and run scripts/sync-patches.sh"
            exit 1
          fi

      - name: Prepare
        id: prep
        run: |
          REVISION=${GITHUB_SHA::8}
          TS=$(date +%s)
          IMAGE_TAG="${MAUTIC_VERSION}-custom-${REVISION}-${TS}"
          LATEST_TAG="${MAUTIC_VERSION}-custom"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            IMAGE_TAG=${GITHUB_REF/refs\/tags\//}
            LATEST_TAG="${MAUTIC_VERSION}-custom"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      # network=host is required for buildkit-in-DinD on the ARC runners —
      # without it the buildkit container cannot reach external networks.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ci
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
              ${{ steps.prep.outputs.IMAGE_TAG }}
              ${{ steps.prep.outputs.LATEST_TAG }}

      # Stage 1: build and LOAD into the local daemon — nothing is pushed yet.
      # The runtime probe below must pass before this image reaches Zot.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MAUTIC_VERSION=${{ env.MAUTIC_VERSION }}
          # gha cache is unusable from self-hosted runners; Zot holds the
          # layer cache (same pattern as the aishell docker workflows).
          cache-from: type=registry,ref=zot.internal.flowbridge.net/cache/mautic:amd64
          cache-to: type=registry,ref=zot.internal.flowbridge.net/cache/mautic:amd64,mode=max,ignore-error=true
          platforms: linux/amd64
          provenance: false

      # Runtime probe: construct the Predis client through the patched
      # PRedisConnectionHelper against a real Redis and ping it — the exact
      # code path that 500ed all tracking endpoints on 2026-09-09 while
      # cache:warmup stayed green. Fails the build before anything is pushed.
      - name: Runtime probe — Redis helper in the built image
        run: |
          docker run -d --name probe-redis --network host redis:7-alpine
          for i in $(seq 1 40); do
            docker exec probe-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 0.5
          done
          docker run --rm --network host \
            -v "$PWD/probe:/probe:ro" \
            -e PROBE_REDIS_URL=redis://127.0.0.1:6379 \
            --entrypoint php \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.prep.outputs.IMAGE_TAG }}" \
            /probe/redis-probe.php
          docker rm -f probe-redis

      # Stage 2: push — a cache-hit rebuild of what was just probed.
      - name: Push Docker image
        id: build-and-push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MAUTIC_VERSION=${{ env.MAUTIC_VERSION }}
          cache-from: type=registry,ref=zot.internal.flowbridge.net/cache/mautic:amd64
          platforms: linux/amd64

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
